name: Radar ETL — fontes oficiais + verificação

on:
  schedule:
    - cron: '0 11 * * *'   # 08:00 America/Sao_Paulo
    - cron: '0 21 * * *'   # 18:00 America/Sao_Paulo
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'scripts/etl/**'
      - 'scripts/*.js'
      - '.github/workflows/radar-etl.yml'

concurrency:
  group: radar-etl
  cancel-in-progress: false

jobs:
  etl:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: ETL imóveis — descoberta em fontes oficiais (GeoSampa WFS)
        run: node scripts/etl/discover_opportunities.js

      - name: ETL imóveis — validação e publicação
        run: node scripts/etl/validate_and_publish.js

      - name: ETL imóveis — auditoria de 100% da base
        run: node scripts/etl/qa_audit.js

      - name: ETL subvenção — extração dos documentos oficiais
        run: node scripts/fetch_subvencao.js

      - name: ETL artigos — geração baseada em evidência
        run: node scripts/generate_articles.js

      - name: ETL mapa — índice derivado da base publicada
        run: node scripts/build_mapa_index.js

      - name: Trava de integridade (falha o pipeline se houver dado não comprovado)
        run: node scripts/verify_data_integrity.js

      - name: Commit dos dados atualizados (somente se houver mudança real)
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Radar ETL"
          git add src/data/*.json data-internal/*.json
          git diff --staged --quiet && echo "sem mudanças reais — nada commitado" || git commit -m "chore(etl): atualização automática a partir de fontes oficiais"
          git push

  build:
    runs-on: ubuntu-latest
    needs: etl
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Build Next.js (inclui trava de integridade)
        run: npm run build
