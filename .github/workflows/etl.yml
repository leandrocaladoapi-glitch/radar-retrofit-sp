name: ETL and Deploy

on:
  schedule:
    - cron: '0 11,21 * * *' # 08:00 and 18:00 BRT (UTC-3)
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ETL Script
        run: node scripts/fetch_subvencao.js

      - name: Build Next.js Application
        run: npm run build

      - name: Commit Updated Data
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add src/data/*.json
          # Only commit if there are changes
          git diff --quiet && git diff --staged --quiet || git commit -m "chore(data): auto update dataset from ETL"
          git push
